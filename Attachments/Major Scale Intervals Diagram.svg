<svg viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Notes and connecting lines -->
  <g id="scale">
    <!-- C -->
    <circle cx="50" cy="100" r="25" fill="#5E81AC" stroke="#81A1C1" stroke-width="2"/>
    <text x="50" y="107" text-anchor="middle" font-size="20" fill="#ECEFF4">C</text>
    
    <!-- Connecting line -->
    <line x1="75" y1="100" x2="95" y2="100" stroke="#ECEFF4" stroke-width="2"/>
    
    <!-- D -->
    <circle cx="120" cy="100" r="25" fill="#5E81AC" stroke="#81A1C1" stroke-width="2"/>
    <text x="120" y="107" text-anchor="middle" font-size="20" fill="#ECEFF4">D</text>
    
    <!-- Connecting line -->
    <line x1="145" y1="100" x2="165" y2="100" stroke="#ECEFF4" stroke-width="2"/>
    
    <!-- E -->
    <circle cx="190" cy="100" r="25" fill="#5E81AC" stroke="#81A1C1" stroke-width="2"/>
    <text x="190" y="107" text-anchor="middle" font-size="20" fill="#ECEFF4">E</text>
    
    <!-- Connecting line -->
    <line x1="215" y1="100" x2="235" y2="100" stroke="#ECEFF4" stroke-width="2"/>
    
    <!-- F -->
    <circle cx="260" cy="100" r="25" fill="#5E81AC" stroke="#81A1C1" stroke-width="2"/>
    <text x="260" y="107" text-anchor="middle" font-size="20" fill="#ECEFF4">F</text>
    
    <!-- Connecting line -->
    <line x1="285" y1="100" x2="305" y2="100" stroke="#ECEFF4" stroke-width="2"/>
    
    <!-- G -->
    <circle cx="330" cy="100" r="25" fill="#5E81AC" stroke="#81A1C1" stroke-width="2"/>
    <text x="330" y="107" text-anchor="middle" font-size="20" fill="#ECEFF4">G</text>
    
    <!-- Connecting line -->
    <line x1="355" y1="100" x2="375" y2="100" stroke="#ECEFF4" stroke-width="2"/>
    
    <!-- A -->
    <circle cx="400" cy="100" r="25" fill="#5E81AC" stroke="#81A1C1" stroke-width="2"/>
    <text x="400" y="107" text-anchor="middle" font-size="20" fill="#ECEFF4">A</text>
    
    <!-- Connecting line -->
    <line x1="425" y1="100" x2="445" y2="100" stroke="#ECEFF4" stroke-width="2"/>
    
    <!-- B -->
    <circle cx="470" cy="100" r="25" fill="#5E81AC" stroke="#81A1C1" stroke-width="2"/>
    <text x="470" y="107" text-anchor="middle" font-size="20" fill="#ECEFF4">B</text>
    
    <!-- Connecting line -->
    <line x1="495" y1="100" x2="515" y2="100" stroke="#ECEFF4" stroke-width="2"/>
    
    <!-- C (octave) -->
    <circle cx="540" cy="100" r="25" fill="#5E81AC" stroke="#81A1C1" stroke-width="2"/>
    <text x="540" y="107" text-anchor="middle" font-size="20" fill="#ECEFF4">C</text>
  </g>
  
  <!-- Interval indicators -->
  <g id="intervals" font-family="Arial, sans-serif">
    <text x="120" y="60" text-anchor="middle" font-size="16" fill="#D8DEE9">M2</text>
    <text x="190" y="60" text-anchor="middle" font-size="16" fill="#D8DEE9">M3</text>
    <text x="260" y="60" text-anchor="middle" font-size="16" fill="#D8DEE9">P4</text>
    <text x="330" y="60" text-anchor="middle" font-size="16" fill="#D8DEE9">P5</text>
    <text x="400" y="60" text-anchor="middle" font-size="16" fill="#D8DEE9">M6</text>
    <text x="470" y="60" text-anchor="middle" font-size="16" fill="#D8DEE9">M7</text>
    <text x="540" y="60" text-anchor="middle" font-size="16" fill="#D8DEE9">P8</text>
  </g>
  
  <!-- Legend - arranged in two columns, three rows -->
  <g font-family="Arial, sans-serif" font-size="16">
    <text x="100" y="170" text-anchor="start" fill="#ECEFF4">M2 = Major 2nd</text>
    <text x="100" y="200" text-anchor="start" fill="#ECEFF4">M3 = Major 3rd</text>
    <text x="100" y="230" text-anchor="start" fill="#ECEFF4">P4 = Perfect 4th</text>
    
    <text x="300" y="170" text-anchor="start" fill="#ECEFF4">P5 = Perfect 5th</text>
    <text x="300" y="200" text-anchor="start" fill="#ECEFF4">M6 = Major 6th</text>
    <text x="300" y="230" text-anchor="start" fill="#ECEFF4">M7 = Major 7th</text>
    
    <text x="300" y="260" text-anchor="start" fill="#ECEFF4">P8 = Perfect Octave</text>
  </g>
</svg>
