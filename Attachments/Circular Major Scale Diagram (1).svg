<svg viewBox="-250 -250 500 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Circle background - using lighter color for outline -->
  <circle cx="0" cy="0" r="200" fill="none" stroke="#ECEFF4" stroke-width="2"/>
  
  <!-- Notes precisely evenly spaced around the circle (360/7 = 51.43 degrees) -->
  <g id="notes">
    <!-- C (0 degrees, 12 o'clock) -->
    <circle cx="0" cy="-200" r="30" fill="#5E81AC" stroke="#81A1C1" stroke-width="2"/>
    <text x="0" y="-193" text-anchor="middle" font-size="24" fill="#ECEFF4">C</text>
    
    <!-- D (51.43 degrees) -->
    <circle cx="160" cy="-122" r="30" fill="#5E81AC" stroke="#81A1C1" stroke-width="2"/>
    <text x="160" y="-115" text-anchor="middle" font-size="24" fill="#ECEFF4">D</text>
    
    <!-- E (102.86 degrees) -->
    <circle cx="191" cy="62" r="30" fill="#5E81AC" stroke="#81A1C1" stroke-width="2"/>
    <text x="191" y="69" text-anchor="middle" font-size="24" fill="#ECEFF4">E</text>
    
    <!-- F (154.29 degrees) -->
    <circle cx="86" cy="182" r="30" fill="#5E81AC" stroke="#81A1C1" stroke-width="2"/>
    <text x="86" y="189" text-anchor="middle" font-size="24" fill="#ECEFF4">F</text>
    
    <!-- G (205.72 degrees) -->
    <circle cx="-86" cy="182" r="30" fill="#5E81AC" stroke="#81A1C1" stroke-width="2"/>
    <text x="-86" y="189" text-anchor="middle" font-size="24" fill="#ECEFF4">G</text>
    
    <!-- A (257.15 degrees) -->
    <circle cx="-191" cy="62" r="30" fill="#5E81AC" stroke="#81A1C1" stroke-width="2"/>
    <text x="-191" y="69" text-anchor="middle" font-size="24" fill="#ECEFF4">A</text>
    
    <!-- B (308.58 degrees) -->
    <circle cx="-160" cy="-122" r="30" fill="#5E81AC" stroke="#81A1C1" stroke-width="2"/>
    <text x="-160" y="-115" text-anchor="middle" font-size="24" fill="#ECEFF4">B</text>
  </g>
  
  <!-- Step indicators -->
  <g id="steps" font-family="Arial, sans-serif">
    <!-- Between C and D -->
    <text x="80" y="-170" text-anchor="middle" font-size="20" fill="#D8DEE9">W</text>
    
    <!-- Between D and E -->
    <text x="185" y="-30" text-anchor="middle" font-size="20" fill="#D8DEE9">W</text>
    
    <!-- Between E and F -->
    <text x="145" y="130" text-anchor="middle" font-size="20" fill="#D8DEE9">H</text>
    
    <!-- Between F and G -->
    <text x="0" y="195" text-anchor="middle" font-size="20" fill="#D8DEE9">W</text>
    
    <!-- Between G and A -->
    <text x="-145" y="130" text-anchor="middle" font-size="20" fill="#D8DEE9">W</text>
    
    <!-- Between A and B -->
    <text x="-185" y="-30" text-anchor="middle" font-size="20" fill="#D8DEE9">W</text>
    
    <!-- Between B and C -->
    <text x="-80" y="-170" text-anchor="middle" font-size="20" fill="#D8DEE9">H</text>
  </g>
  
</svg>
